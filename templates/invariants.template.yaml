# invariants.template.yaml — 불변식(invariant) 선언 단일 원천 (템플릿)
#
# > 인스턴스 산출물의 템플릿 (POLICY-TEMPLATE-ADHERENCE — 손수 자유 작성 금지).
# >   SETTER가 STEP 2에서 이 템플릿을 두 개의 런타임 인스턴스로 조립한다:
# >     - invariants.team.yaml      (팀 공유 · git 추적 — dlc-meta)         ← concern: integrity
# >     - invariants.personal.yaml  (개인 · gitignore — {공유리포}/.claude)  ← concern: ergonomics
# >   둘 다 로드되어 UNION 실행된다. 병합 규칙은 아래 「병합·personal-adjust」.
# > 이 템플릿 자체는 *범용 불변식 + 슬롯*만 담는다. 환경 특화(예: 트래커 결합) 불변식은
# >   <SLOT> 자리에 SETTER가 짜 넣는다 — 프레임워크 레포는 100% 중립(특정 트래커·프로젝트·회사 무참조).
# > 규율 본문: specs/INVARIANT-ENFORCEMENT.md · 엔진: templates/enforce.template.py.
# > 위치: ai-dlc-orchestrator/templates/invariants.template.yaml
#
# ── 계약 버전 ──────────────────────────────────────────────────────────────
# INVARIANTS-CONTRACT: v2
#   본문(스키마·체크 id·훅 JSON 계약)이 바뀌면 이 값을 올린다. SELF-CHECK 계약과 같은 사상.
#   v1 → v2: 키드(keyed) per-work-item 상태머신 체크 3종(keyed-record-on-dispatch /
#            keyed-valid-status-transition / keyed-log-on-done)과 선결 조건 keyed-state-dir 추가
#            (specs/INVARIANT-ENFORCEMENT.md §13 — 동시성-안전 강제. 엔진 INVARIANTS_CONTRACT 상수와 짝).
#   ⚠️ Phase 2→3 (키드 3종 tier warn→block, 이벤트 재바인딩)은 **계약을 올리지 않는다** — 체크 id
#      집합·스키마·훅 JSON 형태(emit())가 그대로이고 오직 tier/event 값만 바뀐 *정책* 변경이라
#      엔진(v2)이 이미 block 을 지원한다. 그래서 계약은 v2 유지 (specs/INVARIANT-ENFORCEMENT.md §13.7).
#
# ── 불변식 1개 스키마 ──────────────────────────────────────────────────────
#   id              : 안정적 kebab-case 식별자. *병합 키*. (필수)
#   concern         : integrity | ergonomics
#                       integrity  = 팀 (프로젝트 전역 · dlc-meta 추적 · invariants.team.yaml)
#                       ergonomics = 개인 (사용자별 · gitignore · invariants.personal.yaml)
#   event           : PreToolUse | PostToolUse | Stop  (단일 이벤트 불변식일 때. 여러 이벤트면 bindings)
#   match           : (PreToolUse·PostToolUse 전용) "사이클 액션"을 신호하는 도구명 glob 목록.
#                       엔진은 tool_name 및 "tool_name:<tool_input 문자열값>" 후보에 대해 fnmatch.
#                       예: ["Task","Agent","Bash:*merge*"] — 서브 디스패치 / 머지 / 트래커 전이 등.
#                       이 값들은 *예시 placeholder*이며 SETTER가 실제 도구·명령에 맞춰 적응한다.
#   check           : 엔진이 구현한 명명된 체크 id (아래 「체크 id」).
#   tier            : block | warn | advisory   (아래 「tier 의미론」)
#   requires        : 실행 선결 조건 id 목록. 하나라도 불충족이면 이 불변식은 *조용히 SKIP*
#                       (미충족 → 건너뜀 = 환경 중립 견고성. 로그 계층·트래커 config 부재 등).
#                       현재 지원: ["local-log-layer"]  (cycles/ 로컬 로그 계층 존재),
#                                  ["keyed-state-dir"] (키드 인덱스 <state_dir> 디렉토리 존재 — §13).
#   scope           : local   (팀 중립 불변식은 local만 — 엔진은 로컬 로그 계층만 읽는다. 네트워크·트래커 없음)
#   personal-adjust : locked | escalate-only | full
#                       개인 파일이 *이 팀 불변식*을 재조정할 수 있는 범위:
#                         locked        = 개인이 손대지 못함 (팀 선언이 최종)
#                         escalate-only = 개인이 tier를 *올리는* 것만 허용 (warn→block). 낮추기·타 필드 변경 금지
#                         full          = 개인이 전체 필드 덮어쓰기 가능
#                       (concern: ergonomics 불변식엔 무의미 — 팀 불변식에만 적용된다)
#   bindings        : 이벤트 바인딩 목록. 한 불변식이 *여러 이벤트*에 걸릴 때 event/match/check 대신 사용.
#     - event       : PreToolUse | PostToolUse | Stop
#       match       : (PreToolUse·PostToolUse 전용) 위 match와 동일
#       check       : 위 check와 동일
#     (단일 이벤트면 bindings 없이 최상위 event/check/match만 둬도 된다)
#
# ── tier 의미론 (block 은 이벤트별로 실효 차단점이 다르다 — specs/INVARIANT-ENFORCEMENT.md §11.4) ──
#   block    : 위반 시 훅이 *차단*. 단 어디서 진짜 막는지는 이벤트에 달렸다:
#                PreToolUse  → 도구 실행 *전* 을 실제 차단(permissionDecision:deny). 강제성의 실체.
#                Stop        → 턴 종료를 차단(decision:block + exit 2), reason 을 다음 턴에 되먹임.
#                PostToolUse → 사후라 *자문뿐*(되돌리지 못함) → PostToolUse엔 block 대신 warn 을 쓴다.
#              실행 전 진짜 차단이 필요한 block-tier 는 PreToolUse 에 바인딩한다.
#   warn     : 위반 시 *비차단 경고*(systemMessage / hookSpecificOutput.additionalContext). 기본 권장값.
#   advisory : no-op — 훅 출력 없음(가시화·기록만). 훅 미지원 degraded 환경의 폴백 등가값.
#
# ── 병합·personal-adjust (엔진이 강제) ────────────────────────────────────
#   - team + personal 두 파일을 id로 병합. *팀이 floor(바닥)*.
#   - 같은 id가 양쪽에 있으면 팀의 personal-adjust에 따른다:
#       locked         → 팀 선언만 사용 (개인 항목 무시)
#       escalate-only  → tier = max(팀, 개인). 그 밖 필드는 팀 고정
#       full           → 개인이 통째로 덮어씀 (id는 유지)
#   - 개인에만 있는 새 id = 자유(그대로 추가). 통상 concern: ergonomics.
#
# ── 체크 id (엔진 구현 — specs/INVARIANT-ENFORCEMENT.md §체크) ────────────
#   [전역 파일럿 — v1]
#   open-cycle-record-exists : 사이클 액션이 있었는데 *열린* cycles/*/audit.md
#                              (CYCLE-START 있고 CYCLE-END 없음, CYCLE-REOPEN 반영)이 하나도 없으면 위반.
#   no-stale-open-cycle      : (Stop 백스톱) 열린 사이클 기록이 턴 경계를 넘겨 잔존하면 위반(가시화).
#   [키드 per-work-item — v2 · §13.5. 각 체크는 *오직 이 키의 상태 파일*(<state_dir>/<key>.json)만
#    읽는다 → 워커 B가 워커 A의 열린 키에 영향받지 않음(동시성-안전) → block-tier 안전(Phase 3).
#    키 없음·state_dir 없음·레코드 malformed → no-op(차단 아님). 키는 오케스트레이터가 디스패치마다
#    발급하는 delegation-id(§13.2) — env AIDLC_WORK_KEY / --work-key / active-포인터로 훅에 도달.]
#   keyed-record-on-dispatch      : (PreToolUse — block) 이 키의 in-progress 레코드가 없는데 사이클-액션
#                                    도구를 실행하려 하면 실행 *전* 차단(위임했으면 먼저 record 하라). Phase 3.
#   keyed-valid-status-transition : (Stop — block 백스톱; 권위 강제는 write-helper 의 exit-2) 이 키가 검증
#                                    없이 done(verified != true)이거나 status가 유효 집합 밖이면 위반.
#   keyed-log-on-done             : (Stop — block) 이 키가 done인데 대응 CYCLE-END 로그 흔적이 없거나,
#                                    아직 in-progress/additional-work인 채 턴 경계를 넘기면 위반. Phase 3.
#
# ── PreToolUse block 바인딩 예시 (실행 전 진짜 차단이 필요한 block-tier) ──────────
#   실행 전 도구를 실제로 막고 싶으면 tier: block + PreToolUse 바인딩을 쓴다. 형태:
#     - id: <불변식 id>
#       concern: integrity
#       tier: block                    # PreToolUse block → permissionDecision:deny (실행 차단)
#       personal-adjust: escalate-only
#       scope: local
#       requires: ["local-log-layer"]
#       bindings:
#         - event: PreToolUse
#           match: [<도구명 glob…>]     # PostToolUse와 동일 규칙
#           check: <체크 id>
#   (PostToolUse에 block을 쓰면 사후라 자문에 그친다 — warn 을 쓰거나 PreToolUse로 옮긴다.)

invariants:

  # ── 파일럿 (범용) ──────────────────────────────────────────────────────
  # cycle-must-log: 사이클 로깅을 "모델이 MD를 읽어 지키는 절차"에서
  #   "프로그램(훅)이 강제하는 불변식"으로 승격한 파일럿. 로컬 로그 계층만 읽으므로
  #   완전 중립이다 (트래커·프로젝트 상수 무참조).
  - id: cycle-must-log
    concern: integrity              # 팀 — dlc-meta에 추적
    tier: warn                      # 기본 warn (block 아님 — 오탐 시 작업을 막지 않는다)
    personal-adjust: escalate-only  # 개인은 warn→block 승격만 허용
    scope: local
    requires: ["local-log-layer"]
    bindings:
      # (1) 사이클 액션 발생 직후 — 열린 로그 기록이 없으면 경고
      #     match는 예시 placeholder다. SETTER가 실제 서브 디스패치·머지·트래커 전이 도구명에 맞춰 적응한다.
      - event: PostToolUse
        match: ["Task", "Agent", "Bash:*merge*", "Bash:*commit*"]
        check: open-cycle-record-exists
      # (2) 턴 경계 백스톱 — 열린 사이클이 남아 있으면 가시화
      - event: Stop
        check: no-stale-open-cycle

  # ── 키드(keyed) per-work-item 상태머신 (범용·중립 — §13.5) ── **Phase 3: block (§13.7)** ──
  # 전역 파일럿(cycle-must-log)과 *공존*한다 — 단 전역은 warn 유지, 키드 3종은 block 이다.
  #   전역 boolean은 동시성(공유 dlc-meta·다중 워커) 하에서 워커 A의 열린 사이클이 워커 B의 Stop을
  #   거는 교차오염 때문에 block-안전하지 않다(§13.1) → 그래서 전역은 영구 warn.
  # 키드 체크는 *이 키의 상태 파일만*(<state_dir>/<key>.json) 읽어 그 교차오염을 제거한다:
  #   워커 B(자기 키 K2, 레코드 있음)는 워커 A(K1, 미기록)의 상태에 *영향받지 않는다* →
  #   block 이 오직 위반한 그 작업 아이템 자신의 행동만 막는다(cross-work-item 부작용 0 — §13.5·§13.7
  #   에서 A↔B 격리 실측 확인). 이것이 "부작용 없는 block"의 실체다.
  # 이 세 불변식은 로컬 파일(state_dir·audit.md)만 읽으므로 트래커 무참조·중립이다 → 템플릿 본문에 둔다.
  #   단 `match`의 실제 디스패치 도구명은 SETTER가 환경 적응(⑥ — 예시 placeholder를 치환).
  # 이벤트 바인딩은 block 이 *실효 AND per-key-safe* 인 지점을 고른다(§11.4 (b)):
  #   (a) → PreToolUse deny (실행 *전* 차단 — 미기록 작업 아이템 자신의 도구만 막음, 워커 B 무영향).
  #   (b) → Stop block 백스톱 (권위 강제는 write-helper 의 exit-2 무효-전이 거부; Stop 은 *이 키* 판정).
  #   (c) → Stop block (이 키가 done-without-log 이거나 열린 채 턴을 넘기면 턴 종료 차단; 이 키만 봄).
  # PostToolUse 에는 block 을 켜지 않는다 — 사후라 자문뿐(§11.4 (b)). Stop-block 무한루프는 엔진의
  #   stop_hook_active 강등 가드가 끊는다(§11.4 (c)). requires 의 keyed-state-dir 로 인덱스 미구성
  #   배포에선 조용히 SKIP(중립 견고성) — degraded 는 여전히 no-op, 차단 아님.
  # personal-adjust: escalate-only 는 이미 block 이므로 개인은 더 올릴 수 없다(사실상 locked 등가) —
  #   구조 일관을 위해 유지. Phase 2(warn)로 되돌리려면 이 세 tier 만 warn 으로 내린다.

  # (a) 위임(디스패치)했으면 *실행 전에* 이 키의 in-progress 레코드가 있어야 한다 — 없으면 PreToolUse deny.
  - id: keyed-record-on-dispatch
    concern: integrity
    tier: block                     # Phase 3 — PreToolUse deny(실행 전 진짜 차단). per-key 라 부작용 0(§13.7).
    personal-adjust: escalate-only
    scope: local
    requires: ["local-log-layer", "keyed-state-dir"]
    bindings:
      - event: PreToolUse           # 실행 *전* 을 막는 유일한 지점 — 미기록 작업 아이템 자신의 도구만 deny.
        match: ["Task", "Agent"]    # 예시 placeholder — SETTER가 실제 서브 디스패치 도구명으로 적응(⑥).
        check: keyed-record-on-dispatch

  # (b) 이 키가 검증 없이 done 이거나 status 가 유효 집합 밖이면 block(Stop 백스톱) — 검증 없이 완료로
  #     건너뛰지 마라. *권위 강제*는 write-helper 서브커맨드가 이미 한다(무효 전이·검증 없는 done →
  #     exit 2 거부, §13.4). 이 Stop 체크는 손상/외부 조작된 레코드가 턴을 넘기지 못하게 하는 백스톱이며
  #     *이 키만* 읽어 per-key-safe 하다. PostToolUse 바인딩은 두지 않는다(사후 block = 자문뿐, §11.4).
  - id: keyed-valid-status-transition
    concern: integrity
    tier: block
    personal-adjust: escalate-only
    scope: local
    requires: ["local-log-layer", "keyed-state-dir"]
    bindings:
      - event: Stop
        check: keyed-valid-status-transition

  # (c) 이 키가 done 인데 CYCLE-END 흔적이 없거나, 아직 열린 채 턴 경계를 넘기면 block(턴 종료 차단).
  #     전역 no-stale-open-cycle 과 달리 *이 키만* 보므로 A의 열림이 B의 Stop을 걸지 않는다(§13.5) →
  #     block-safe. Stop-block 재진입은 stop_hook_active 로 warn 강등돼 무한루프를 끊는다(§11.4 (c)).
  - id: keyed-log-on-done
    concern: integrity
    tier: block
    personal-adjust: escalate-only
    scope: local
    requires: ["local-log-layer", "keyed-state-dir"]
    bindings:
      - event: Stop
        check: keyed-log-on-done

  # <SLOT: project-adaptive invariants>
  # SETTER가 STEP 2에서 환경 특화(예: 트래커 결합) 불변식을 여기 짜 넣는다.
  # 프레임워크 레포엔 *구현하지 않고 슬롯만* 둔다 — 특정 트래커/프로젝트/회사 무참조 유지.
  # 예시(트래커 결합 — 어댑터가 requires/check를 주입, 여기선 주석):
  #   - id: cycle-must-bind-ticket
  #     concern: integrity
  #     tier: warn
  #     personal-adjust: escalate-only
  #     scope: local
  #     requires: ["local-log-layer", "issue-tracker-config"]
  #     bindings:
  #       - event: Stop
  #         check: <어댑터가 제공하는 체크 id>
  # <END SLOT: project-adaptive invariants>
